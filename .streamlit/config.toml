[theme]
base = "light"
backgroundColor = "#F7F6F3"        # warm bone canvas
secondaryBackgroundColor = "#EFEEEA"
textColor = "#2F3437"
primaryColor = "#2F3437"           # controls in charcoal; colour is reserved for data and verdict tags
font = "sans serif"

[client]
toolbarMode = "minimal"

[server]
headless = true

[browser]
gatherUsageStats = false
