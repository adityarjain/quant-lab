name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Checks (look-ahead guard, closed forms, synthetic data, dashboard)
        run: python tests.py

  reproduce:
    # Every results table must regenerate byte-for-byte from the committed price, rate and factor caches.
    # Required: verified identical on macOS and Linux (M13, M14 runs). If it ever fails, either a result
    # changed (update README numbers and commit the new figures/*.md) or a platform float difference
    # flipped a rounded digit (investigate before relaxing this check).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run.py
      - name: Tables unchanged
        run: git diff --exit-code -- 'figures/*.md'
